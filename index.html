<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= bumps when icons change. Full-bleed 512px art + manifest
         purpose any maskable so Android does not letterbox on white;
         slight center zoom keeps saturated pixels at the circular mask. -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-japan-192.png?v=1" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-japan.png?v=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2A4166" />

    <!-- Installable web app: lets Android Chrome fire `beforeinstallprompt`
         and gives the saved-to-home-screen launcher a name + icon. -->
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- iOS Safari: Apple ignores the manifest, so these meta tags are how
         we get a clean home-screen icon, a custom short label, and a
         standalone (chrome-less) launch experience. -->
    <link rel="apple-touch-icon" href="./icon-japan.png?v=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Stein trip to Japan" />

    <title>Japan 2026 — The Stein Family Trip</title>
    <meta
      name="description"
      content="Seventeen days across Japan, 1–17 November 2026 — Eti, Ronen, Matan and Amit's family itinerary, map, stays, attractions and tips."
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://matan97nnn-prog.github.io/japan-2026/" />

    <!-- Open Graph (WhatsApp, Facebook, iMessage, LinkedIn, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Japan 2026" />
    <meta property="og:url" content="https://matan97nnn-prog.github.io/japan-2026/" />
    <meta property="og:title" content="Japan 2026 — The Stein Family Trip" />
    <meta
      property="og:description"
      content="Seventeen days across Japan, 1–17 November 2026. Itinerary, map, stays and tips for our family adventure."
    />
    <meta property="og:image" content="https://matan97nnn-prog.github.io/japan-2026/icon-japan.png" />
    <meta property="og:image:secure_url" content="https://matan97nnn-prog.github.io/japan-2026/icon-japan.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="A torii gate under a rising sun — the Stein family's Japan trip." />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X (also used as a fallback by some clients) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Japan 2026 — The Stein Family Trip" />
    <meta
      name="twitter:description"
      content="Seventeen days across Japan, 1–17 November 2026. Itinerary, map, stays and tips for our family adventure."
    />
    <meta name="twitter:image" content="https://matan97nnn-prog.github.io/japan-2026/icon-japan.png" />
    <meta name="twitter:image:alt" content="A torii gate under a rising sun — the Stein family's Japan trip." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Rubik:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
